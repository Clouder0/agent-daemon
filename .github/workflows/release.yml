name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        run: python -m pip install cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/agent-daemon-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" agentd agentdctl
      - uses: actions/upload-artifact@v7
        with:
          name: agent-daemon-${{ matrix.target }}
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  publish:
    # crates.io first publish + every future version (ADR-0002's "when it
    # earns itself"; requires the CARGO_REGISTRY_TOKEN repo secret).
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
