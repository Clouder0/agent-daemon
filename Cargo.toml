[package]
name = "agent-daemon"
version = "0.1.0"
edition = "2024"
description = "Edge-side event dispatch daemon for Agent Native Domains: turns NATS JetStream events into local handler invocations"
license = "Apache-2.0"
repository = "https://github.com/Clouder0/agent-daemon"
readme = "README.md"
keywords = ["agent", "nats", "jetstream", "daemon", "events"]
categories = ["command-line-utilities"]

# Binaries keep the whitepaper vocabulary: agentd / agentdctl.
[[bin]]
name = "agentd"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "signal", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
async-nats = "0.50.0"
futures-util = "0.3.34"

# Landing with the issue that first uses it: async-nats.

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
